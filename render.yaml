# Render Blueprint: New → Blueprint → pick this repo. Creates the free game server.
services:
  - type: web
    name: tiny-planet
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL # paste your free database link here later (Neon or another Postgres)
        sync: false
      - key: ANTHROPIC_API_KEY # lets Bolt answer players' questions with AI (from console.anthropic.com)
        sync: false
